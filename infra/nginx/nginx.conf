# Lightweight API Gateway (docs/SDD.md §1.1's "Edge / API Layer") —
# deliberately just the "single entry point, path-based routing" slice of
# that layer's responsibilities. What it does NOT do, on purpose:
#
#   - Tenant resolution via subdomain — the SDD calls for subdomain -> tenant
#     mapping, but this platform has exactly one tenant (METROCK) and no
#     subdomain infrastructure exists to resolve. Building that now would be
#     infrastructure for a problem that doesn't exist yet.
#   - Per-TENANT rate limiting (tiered by subscription level, per the SDD)
#     — nothing to tier by with only one tenant in the system. This is
#     genuinely different from the flat, non-tenant-aware flood/DoS cap
#     below: that one applies unconditionally, the same way `helmet`'s
#     headers don't wait for a reason not to.
#   - JWT verification / auth of any kind — this is a transparent proxy.
#     Every backend service already verifies its own Keycloak-issued Bearer
#     token (KeycloakAuthMiddleware, packages/backend-common); duplicating
#     that here would be real defense-in-depth eventually, but adds a second
#     place to keep in sync for zero benefit while there's only one client
#     and one tenant. The Authorization header passes through untouched.
#   - Relocating /sync/push /sync/pull into a separate Sync Gateway service
#     (the SDD's other Edge-layer component) — they're correctly placed
#     inside each domain service today; moving them serves no one until sync
#     logic genuinely needs to be shared/deduplicated across services.
#
# Each service still runs directly on the host (this project's existing dev
# pattern, not containerized) — host.docker.internal resolves the host
# machine from inside this container (Docker Desktop on macOS/Windows does
# this automatically; the extra_hosts entry in docker-compose.yml is there
# for Linux Docker Engine, where it's not automatic).

events {}

http {
  # Docker's embedded DNS (always 127.0.0.11 inside any container on a
  # Docker-managed network) resolves host.docker.internal to BOTH an IPv6
  # and an IPv4 address. A plain `proxy_pass http://host.docker.internal:PORT`
  # resolves that hostname ONCE at config load and round-robins across
  # every address returned — including the IPv6 one, which has no route
  # from inside this container and fails with "Network unreachable" before
  # nginx retries on IPv4 (self-healing, but a wasted connection attempt
  # and a scary log line on the first request after every restart — found
  # exactly this way while verifying this config). `ipv6=off` here plus a
  # variable in each proxy_pass below forces per-request resolution
  # through this resolver instead of nginx's static startup-time lookup,
  # which is what actually skips the IPv6 record rather than just
  # tolerating the failure.
  #
  # Using a variable in proxy_pass has a well-known side effect, ALSO found
  # while verifying this config (first pass 404'd every request): it
  # disables nginx's automatic "replace the matched location prefix with
  # proxy_pass's URI part" rewriting, so the prefix is no longer stripped
  # on its own — each location below now does that explicitly via
  # `rewrite ... break` before proxy_pass, which just forwards the
  # already-rewritten URI as-is.
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Flat, non-tenant-aware flood/DoS protection (see header comment above
  # for why this is deliberately NOT the SDD's per-tenant-tier rate
  # limiting). Keyed by client IP; 100 requests/minute with a burst
  # allowance of 20 processed without delay — a generous, clearly-dev-
  # appropriate default, not a real production SLA number (the SDD ties
  # those to a tenant tier that doesn't exist yet). This is a SEPARATE
  # layer from @metrock/backend-common's own RateLimitModule (applied
  # inside each of the 8 services): this one only sees traffic that goes
  # through this gateway, but every service is also directly reachable on
  # its own port, so the app-level module covers what this can't.
  limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=100r/m;
  limit_req_status 429;

  server {
    listen 8000;

    limit_req zone=gateway_limit burst=20 nodelay;

    # accounting-service (3004) is deliberately NOT routed here — it has no
    # Flutter mobile dependency (no SyncModule entry, confirmed against
    # apps/mobile/lib/core/sync/api_client.dart), so nothing calls it
    # through this gateway today. Add a location block for it the same way
    # as the others below if that ever changes.

    location /procurement/ {
      set $upstream http://host.docker.internal:3001;
      rewrite ^/procurement/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location /manufacturing/ {
      set $upstream http://host.docker.internal:3002;
      rewrite ^/manufacturing/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location /sales/ {
      set $upstream http://host.docker.internal:3003;
      rewrite ^/sales/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location /crm/ {
      set $upstream http://host.docker.internal:3005;
      rewrite ^/crm/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location /fleet/ {
      set $upstream http://host.docker.internal:3006;
      rewrite ^/fleet/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location /hr/ {
      set $upstream http://host.docker.internal:3007;
      rewrite ^/hr/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location /governance/ {
      set $upstream http://host.docker.internal:3008;
      rewrite ^/governance/(.*)$ /$1 break;
      proxy_pass $upstream;
    }
  }
}
