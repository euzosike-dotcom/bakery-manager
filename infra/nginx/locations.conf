# Shared by both server blocks in nginx.conf (plain :8000 and TLS :8443) —
# `include`d rather than duplicated, since the routing itself doesn't
# depend on which listener a request arrived on.
#
# accounting-service (3004) is deliberately NOT routed here — it has no
# Flutter mobile dependency (no SyncModule entry, confirmed against
# apps/mobile/lib/core/sync/api_client.dart), so nothing calls it through
# this gateway today. Add a location block for it the same way as the
# others below if that ever changes.

location /procurement/ {
  set $upstream http://host.docker.internal:3001;
  rewrite ^/procurement/(.*)$ /$1 break;
  proxy_pass $upstream;
}

location /manufacturing/ {
  set $upstream http://host.docker.internal:3002;
  rewrite ^/manufacturing/(.*)$ /$1 break;
  proxy_pass $upstream;
}

