name: metrock-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metrock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metrock_dev_password}
      POSTGRES_DB: metrock_erp
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
      - ./postgres/migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrock -d metrock_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      # Advertised as localhost:9092, not redpanda:9092: procurement-service
      # and ledger-service both run on the host for this vertical slice, not
      # as containers on the compose network. Kafka clients connect once to
      # the bootstrap address, then re-dial whatever address the broker
      # advertises in its cluster metadata — advertising the in-network
      # hostname here breaks every host-run consumer/producer with a DNS
      # lookup failure on "redpanda" after the very first connection
      # succeeds. If a service is later containerized on this compose
      # network, it needs its own listener (Redpanda supports multiple
      # advertised listeners) rather than flipping this back.
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-metrock}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-metrock_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.miniodata:/data

  # Replaces TenantContextMiddleware's stub-header auth (SDD §1.2) —
  # started as dev-mode (start-dev), admin/admin credentials by default
  # (override via infra/.env, see infra/.env.example — never committed as
  # anything but this well-known local-dev default). NOT production
  # config. --import-realm loads realm-export.json on every
  # boot; re-importing an already-existing realm is a Keycloak no-op, so
  # this is safe to restart repeatedly. See infra/keycloak/seed-users.sh
  # for the companion script that creates a Keycloak user per existing
  # Postgres `users` row.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # --https-* flags add an HTTPS listener alongside the plain :8080 one
    # start-dev already provides — doesn't touch the existing HTTP issuer
    # URL (still http://localhost:8080/realms/metrock, unchanged in
    # realm-export.json and every service's KEYCLOAK_ISSUER), so this is
    # additive, not a switch. See infra/certs/generate-dev-certs.sh and
    # docs/RUNBOOK.md's "TLS termination" section — same self-signed dev
    # cert the gateway uses.
    command: start-dev --import-realm --https-certificate-file=/etc/keycloak-certs/dev-cert.pem --https-certificate-key-file=/etc/keycloak-certs/dev-key.pem
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
      # Host-side 8543, not 8443 — Keycloak's own default HTTPS port
      # (container-internal, unchanged) would otherwise collide with the
      # gateway's host-side 8443 mapping below; these are two separate
      # containers, each needs its own host port.
      - "8543:8443"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./certs:/etc/keycloak-certs:ro

  # Lightweight API Gateway (docs/SDD.md §1.1's "Edge / API Layer") — path-
  # based routing to a single entry point, flat flood/DoS rate limiting,
  # and (both :8000 and :8443) TLS termination on the HTTPS listener; see
  # nginx.conf's own header comment for exactly what this does and
  # deliberately does not do (no tenant resolution, no per-tenant rate
  # limiting, no auth — a transparent proxy). The 8 backend services still
  # run on the host, not in this compose network, hence
  # host.docker.internal below.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      # Automatic on Docker Desktop (macOS/Windows); required explicitly on
      # Linux Docker Engine, where host.docker.internal doesn't resolve
      # without this.
      - "host.docker.internal:host-gateway"

  # Observability (docs/RUNBOOK.md's "Observability" section) — scrapes
  # every backend service's new /metrics endpoint (all 8 Node services +
  # the Go ledger-service), a static target list matching this
  # platform's own fixed set of services (infra/prometheus/prometheus.yml).
  # Same host.docker.internal pattern as the gateway above: those
  # services run on the host, not in this compose network.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Pre-provisioned with the Prometheus datasource and one dashboard
  # (infra/grafana/provisioning/, infra/grafana/dashboards/) — no manual
  # click-through setup needed after `docker compose up`. Proof-of-
  # pattern for now (docs/RUNBOOK.md): there's no real production traffic
  # yet for these panels to be load-bearing against, but the scrape/
  # dashboard pipeline itself is real, not just config that parses.
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./.grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
