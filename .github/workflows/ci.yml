name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Phase 1 piloted this shape on governance-service alone; Phase 2 turns it
  # into a matrix over the other 7 Node services now that each has its own
  # jest.config.js + spec file (docs/RUNBOOK.md's "CI + test suite" sections).
  node-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - governance-service
          - procurement-service
          - manufacturing-service
          - sales-service
          - accounting-service
          - fleet-service
          - hr-service
          - crm-service
          - finance-connector-service
    env:
      # prisma generate reads the schema statically and does not connect to
      # this URL, but requires a syntactically valid one to be present.
      DATABASE_URL: postgresql://user:password@localhost:5432/metrock_erp?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build @metrock/backend-common
        working-directory: packages/backend-common
        run: |
          npm install
          npm run build

      - name: Install ${{ matrix.service }} dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm install

      - name: Generate Prisma client
        working-directory: backend/${{ matrix.service }}
        run: npx prisma generate

      - name: Build
        working-directory: backend/${{ matrix.service }}
        run: npm run build

      - name: Test
        working-directory: backend/${{ matrix.service }}
        run: npm test -- --ci

  # ledger-service is Go, not Node — separate job, no matrix entry above.
  # Covers only the pure helper functions (amountFromPayload, nullableUUID)
  # for now; PostingEngine.Handle itself needs a real *pgxpool.Pool (a
  # concrete struct, not mockable the way Prisma's tx boundary is) and is
  # deferred to Phase 3's integration tests against real Postgres.
  ledger-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: backend/ledger-service
        run: go build ./...

      - name: Vet
        working-directory: backend/ledger-service
        run: go vet ./...

      - name: Test
        working-directory: backend/ledger-service
        run: go test ./...

  # Phase 3 of the CI + test suite plan: real Postgres, not a mock. Runs the
  # SAME migrations + seed files infra/postgres/migrations and .../seed use
  # locally (docs/RUNBOOK.md "2. Run migrations + seed data") against a
  # throwaway service-container database, then tests procurement-service
  # against it as the real least-privilege procurement_svc role — proving
  # RLS cross-tenant isolation and real SQL correctness, neither of which
  # the fully-mocked Phase 1/2 unit suites can catch.
  procurement-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metrock
          POSTGRES_PASSWORD: metrock_dev_password
          POSTGRES_DB: metrock_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: metrock_dev_password
      DATABASE_URL: postgresql://procurement_svc:procurement_svc_dev_password@localhost:5432/metrock_erp?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migrations
        run: |
          set -e
          for f in infra/postgres/migrations/*.sql; do
            psql -h localhost -U metrock -d metrock_erp -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run seed data
        run: |
          set -e
          # dev_seed.sql MUST run first — it creates the tenant_registry
          # row + roles/plants every other seed file's foreign keys depend
          # on. A plain alphabetically-globbed loop runs crm_seed.sql
          # before dev_seed.sql and silently drops its INSERT (found while
          # verifying this exact CI step: psql does not fail the shell on
          # a SQL error by default, so the loop reported success while
          # `customers` stayed empty — -v ON_ERROR_STOP=1 turns that class
          # of bug into a real CI failure instead of quietly incomplete
          # seed data).
          psql -h localhost -U metrock -d metrock_erp -v ON_ERROR_STOP=1 -f infra/postgres/seed/dev_seed.sql
          for f in infra/postgres/seed/*.sql; do
            [ "$f" = "infra/postgres/seed/dev_seed.sql" ] && continue
            psql -h localhost -U metrock -d metrock_erp -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build @metrock/backend-common
        working-directory: packages/backend-common
        run: |
          npm install
          npm run build

      - name: Install procurement-service dependencies
        working-directory: backend/procurement-service
        run: npm install

      - name: Generate Prisma client
        working-directory: backend/procurement-service
        run: npx prisma generate

      - name: Run integration tests
        working-directory: backend/procurement-service
        run: npm run test:integration -- --ci

  # Phase 4 of the CI + test suite plan: the Flutter mobile app. Two files
  # under test/ — auth_client_test.dart (the PKCE login/refresh/logout flow
  # and the secure-storage round-trip, mocktail fakes for FlutterAppAuth/
  # FlutterSecureStorage, both already constructor-injectable) and
  # goods_receipt_repository_test.dart (the offline outbox-event write path,
  # against a real in-memory sqlite database via AppDatabase's new optional
  # QueryExecutor constructor param — not a mock, same "real where it's
  # cheap" reasoning as Phase 3's Postgres tests). `flutter analyze` runs
  # first since neither `flutter test` nor `flutter build` catch every
  # static issue on their own.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      # pubspec.yaml bundles infra/certs/dev-cert.pem as an asset (TLS
      # termination Part B, docs/RUNBOOK.md) — gitignored and regenerated
      # per-machine, same as every other dev environment; `flutter
      # analyze` fails on the declared-but-missing asset otherwise.
      - name: Generate dev TLS cert
        run: infra/certs/generate-dev-certs.sh

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate Drift code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
